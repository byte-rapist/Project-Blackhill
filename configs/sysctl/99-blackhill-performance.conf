# BLACKHILL optional performance-oriented sysctl
# Can coexist with hardening. Apply with:
#   sudo cp configs/sysctl/99-blackhill-performance.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# These do NOT weaken the security sysctls; they tune scheduler/VM behavior.

# Slightly more aggressive swapping avoidance on systems with enough RAM
vm.swappiness = 10

# Cache pressure — default 100; lower can help desktop responsiveness
vm.vfs_cache_pressure = 50

# Dirty ratios — reduce long writeback stalls on spinning disks / heavy IO
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Network: sensible defaults already in hardening; no conflicting changes here
