# BLACKHILL USBGuard rules (example baseline)
# Start in a relatively open state for usability, then tighten.
# Generate a better ruleset with: usbguard generate-policy

# Allow USB hubs
allow with-interface equals { 09:00:00 }

# Allow HID (keyboards, mice)
allow with-interface equals { 03:*:* }

# Allow mass storage (comment out for higher paranoia)
allow with-interface equals { 08:*:* }

# Block everything else by default (ImplicitPolicyTarget=block)
