# BLACKHILL USBGuard rules — Phase 1 improved baseline
# Generate a hardware-specific policy with:
#   sudo usbguard generate-policy > /etc/usbguard/rules.conf
# Then tighten further.

# Allow USB hubs
allow with-interface equals { 09:00:00 }

# Allow HID (keyboards, mice, etc.)
allow with-interface equals { 03:*:* }

# Allow mass storage (comment out for higher paranoia)
allow with-interface equals { 08:*:* }

# Allow USB network adapters (optional — comment if not needed)
# allow with-interface equals { 02:*:* }

# Allow smart card / CCID readers (optional)
# allow with-interface equals { 0b:*:* }

# Reject known dangerous classes by default can be added here
# Example: block USB printers if not needed
# block with-interface equals { 07:*:* }

# Everything else falls under ImplicitPolicyTarget=block
