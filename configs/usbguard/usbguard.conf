# BLACKHILL USBGuard baseline policy (starting point)
# Install usbguard, then place rules and enable the service.
# This is a conservative starting point — adjust to your hardware.

# Rule file location (default)
RuleFile=/etc/usbguard/rules.conf

# Implicit policy target
ImplicitPolicyTarget=block

# Present controller policy
PresentControllerPolicy=keep

# Present device policy
PresentDevicePolicy=apply-policy

# Inserted device policy
InsertedDevicePolicy=apply-policy

# Restore controller device state
RestoreControllerDeviceState=false

# Device manager backend
DeviceManagerBackend=uevent

# IPC allowed users/groups (adjust)
IPCAllowedUsers=root
IPCAllowedGroups=wheel

# Hide devices without permission from IPC clients
HidePII=true
