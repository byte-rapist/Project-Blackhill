# BLACKHILL Hyprlock — Bubble glass lock screen

general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path =
    color = rgba(8, 8, 8, 1.0)
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(196, 30, 58, 0.7)
    inner_color = rgba(20, 20, 20, 0.55)
    font_color = rgba(232, 232, 232, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Unlock</i>
    hide_input = false
    rounding = 18
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = BLACKHILL
    color = rgba(196, 30, 58, 1.0)
    font_size = 26
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.92)
    font_size = 72
    font_family = Inter
    position = 0, 200
    halign = center
    valign = center
}
