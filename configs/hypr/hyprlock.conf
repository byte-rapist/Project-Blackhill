# BLACKHILL Hyprlock configuration
# Premium dark lock screen

general {
    disable_loading_bar = true
    grace = 3
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = 
    color = rgba(10, 10, 10, 1.0)
    blur_passes = 2
    blur_size = 5
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(139, 0, 0, 0.8)
    inner_color = rgba(20, 20, 20, 0.9)
    font_color = rgba(232, 232, 232, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Authentication required</i>
    hide_input = false
    rounding = 8
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = BLACKHILL
    color = rgba(196, 30, 58, 1.0)
    font_size = 28
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(232, 232, 232, 0.9)
    font_size = 64
    font_family = Inter
    position = 0, 180
    halign = center
    valign = center
}
