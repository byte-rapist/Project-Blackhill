# BLACKHILL Hyprland — MAXIMUM PERFORMANCE profile
# Source this instead of (or after) the main config when you want zero lag.
# Usage: add to hyprland.conf:
#   source = ~/.config/hypr/hyprland-performance.conf

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    vfr = true
    vrr = 1
}

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
}
