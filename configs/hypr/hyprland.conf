# BLACKHILL Hyprland — Bubble Glass Edition
# Soft rounded windows, frosted glass blur, deep shadows (iPhone / Windows 11 style)

monitor=,preferred,auto,1

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun -theme blackhill
$browser = firefox

exec-once = waybar
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hypridle

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, E, exit
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# ─── BUBBLE GLASS LOOK ───
general {
    gaps_in = 10
    gaps_out = 18
    border_size = 2
    col.active_border = rgba(C41E3Aaa) rgba(8B0000aa) 45deg
    col.inactive_border = rgba(ffffff22)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    # Soft bubble corners (iPhone-like)
    rounding = 20
    rounding_power = 2

    # Frosted glass transparency
    active_opacity = 0.92
    inactive_opacity = 0.82
    fullscreen_opacity = 1.0

    # Deep, soft, multi-layer style shadows
    shadow {
        enabled = true
        range = 28
        render_power = 4
        color = rgba(000000cc)
        offset = 0 8
        scale = 0.97
    }

    # Heavy frosted blur (Windows Acrylic / iOS style)
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
        noise = 0.02
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.25
        vibrancy_darkness = 0.15
    }
}

animations {
    enabled = true
    bezier = softOvershoot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = easeOut, 0.16, 1, 0.3, 1

    animation = windows, 1, 5, softOvershoot, popin 85%
    animation = windowsOut, 1, 4, smoothOut, popin 90%
    animation = border, 1, 6, easeOut
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 5, easeOut, slidevert
    animation = specialWorkspace, 1, 5, easeOut, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Floating windows get extra bubble treatment
windowrulev2 = opacity 0.90 0.90, floating:1
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = rounding 24, floating:1
