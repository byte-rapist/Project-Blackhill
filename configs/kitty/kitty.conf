# BLACKHILL Kitty terminal theme

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 12.0

foreground #E8E8E8
background #0A0A0A
selection_foreground #0A0A0A
selection_background #C41E3A

url_color #C41E3A
cursor #C41E3A
cursor_text_color #0A0A0A

color0  #0A0A0A
color1  #C62828
color2  #2E7D32
color3  #F9A825
color4  #8B0000
color5  #C41E3A
color6  #00838F
color7  #E8E8E8
color8  #2A2A2A
color9  #EF5350
color10 #66BB6A
color11 #FFEE58
color12 #C41E3A
color13 #EC407A
color14 #26C6DA
