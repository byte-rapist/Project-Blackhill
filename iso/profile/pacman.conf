#
# /etc/pacman.conf for BLACKHILL ISO build
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Multilib optional — uncomment if needed
# [multilib]
# Include = /etc/pacman.d/mirrorlist
